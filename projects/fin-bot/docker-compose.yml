services:
  postgres:
    image: postgres:16
    container_name: finbot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: finbot
      POSTGRES_USER: finbot
      POSTGRES_PASSWORD: finbot
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finbot -d finbot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
