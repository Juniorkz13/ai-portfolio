version: "3.9"

services:
  graph-rag-api:
    build:
      context: ./projects/05_llms
      dockerfile: Dockerfile
    image: ai-portfolio-graph-rag
    container_name: graph_rag_api
    ports:
      - "8000:8000"
    volumes:
      - ./projects/05_llms/data:/app/data
      - ./projects/05_llms/faiss_index:/app/faiss_index
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface
      - NVIDIA_VISIBLE_DEVICES=all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    restart: unless-stopped

  rag-enterprise-assistant:
    build:
      context: ./projects/rag-enterprise-assistant
      dockerfile: Dockerfile
    container_name: rag-enterprise-assistant
    ports:
      - "8001:8000" 
    env_file:
      - ./projects/rag-enterprise-assistant/.env
    restart: unless-stopped

  # Legal RAG Multi-Agent Service
  legal-rag-api:
    build:
      context: ./projects/legal-rag-multi-agent
      dockerfile: Dockerfile
    container_name: legal-rag-api
    ports:
      - "8000:8000"
    environment:
      # Gemini API Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      
      # JWT Configuration
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-your-very-secure-secret-key-here-at-least-32-characters}
      JWT_ALGORITHM: HS256
      JWT_EXPIRATION_MINUTES: 30
      
      # Rate Limiting
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW_SECONDS: 3600
      
      # Application Settings
      APP_NAME: "Legal RAG Multi-Agent"
      APP_VERSION: "1.0.0"
      DEBUG: "false"
      LOG_LEVEL: INFO
    
    volumes:
      # Mount source code for development (optional, remove in production)
      - ./projects/legal-rag-multi-agent/app:/app/app
      - ./projects/legal-rag-multi-agent/tests:/app/tests
    
    restart: unless-stopped
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    
    networks:
      - ai-portfolio-network

networks:
  ai-portfolio-network:
    driver: bridge